name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test, lint, typecheck, audit, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit --pretty false
      - run: pnpm audit --prod
      - run: pnpm build
